version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}  # Todos los datos en .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # PERSISTENCIA donde se guardan los datos reales
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d # Scripts que corren al inicio
    networks:
      - app_network

  app:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
    - .:/app
    environment:
      # Conexión a la DB
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db # Espera a que el contenedor de DB inicie
    networks:
      - app_network

volumes:
  postgres_data: # Definición del volumen nombrado

networks:
  app_network:
    driver: bridge