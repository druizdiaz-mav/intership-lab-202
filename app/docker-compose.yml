services:
  api:
    build: .
    container_name: order_web_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - postgres.env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/app_db

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    env_file:
      - postgres.env
    ports:
      - "5432:5432"

volumes:
  postgres_data: